[project]
name = "agentic_swarm"
version = "0.1.0"
description = "Hierarchical multi-agent code-generation swarm with an adversarial critic loop (LangGraph + Pydantic v2 + Langfuse)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.3",
    "langchain-core>=1.6.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.4",
    "langfuse>=4.15.4",
    "langgraph>=1.2.12",
    "mcp>=2.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0",
]

[tool.uv]
# Application, not a library: `src` is imported as a top-level package from the repo root.
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py313"
line-length = 100
cache-dir = ".cache/ruff"
extend-exclude = [".cache", "output"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF",
    "ASYNC", "PT", "RET", "ARG", "PL", "TRY", "ANN",
]
ignore = [
    "TRY003",  # long messages on exception construction are fine
    "PLR2004", # magic values in tests / thresholds
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001", "ARG002", "ANN401", "S603", "S607"]  # fakes match protocols; tests drive real git

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
cache_dir = ".cache/mypy"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
cache_dir = ".cache/pytest"
addopts = "-ra -p no:cacheprovider"

[tool.coverage.run]
source = ["src"]
branch = true
data_file = ".cache/coverage/.coverage"

[tool.coverage.report]
# CI fails below this floor (measured: 99% branch coverage; the mandated minimum is 85%).
fail_under = 95
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- bandit (own code, CI gate)
[tool.bandit]
exclude_dirs = ["tests", ".venv", ".cache"]
